<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>2004 Singleplayer Progressive</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }

            html, body {
                background: #000;
                overflow: hidden;
                font-family: Arial, sans-serif;
                height: 100vh;
                width: 100vw;
            }

            /* Root flex row: canvas | hiscores panel | xp tracker panel | toolbar */
            #layout {
                display: flex;
                width: 100vw;
                height: 100vh;
            }

            /* Canvas grows to fill all remaining space, letterboxes to preserve 765:503 */
            #canvas-wrap {
                flex: 1 1 0;
                min-width: 0;
                overflow: auto;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #canvas {
                background: #000;
                border: none;
                display: block;
                width: 100%;
                height: 100%;
                max-width: calc(100vh * 765 / 503);
                max-height: calc(100vw * 503 / 765);
                image-rendering: pixelated;
                outline: none;
                box-shadow: none;
            }

            #canvas.hd-mode-active {
                image-rendering: auto;
                transform: translateZ(0);
                backface-visibility: hidden;
                will-change: transform;
            }

            #canvas:focus,
            #canvas:focus-visible {
                outline: none;
                box-shadow: none;
            }

            #layout.app-fullscreen-fill #canvas-wrap,
            #layout.app-fullscreen-half #canvas-wrap {
                overflow: hidden;
            }

            #layout.app-fullscreen-fill #canvas {
                width: 100% !important;
                height: 100% !important;
                max-width: none !important;
                max-height: none !important;
            }

            #layout.app-fullscreen-half #canvas {
                width: auto !important;
                height: 100% !important;
                max-width: none !important;
                max-height: none !important;
            }

            /* ── Shared side panel base ── */
            .side-panel {
                flex-shrink: 0;
                flex-grow: 0;
                flex-basis: auto;
                max-width: 0;
                overflow: hidden;
                background: #0c0c0c;
                border-left: none;
                display: flex;
                flex-direction: column;
                transition: max-width 0.2s ease;
            }

            .side-panel.open {
                border-left: 1px solid #242424;
            }

            /* Hiscores panel */
            #hiscores-panel { width: 340px; }
            #hiscores-panel.open { max-width: 340px; }

            /* XP Tracker panel */
            #xptracker-panel { width: 280px; }
            #xptracker-panel.open { max-width: 280px; }

            /* Toolbar — fixed width, never overlaps canvas */
            #toolbar {
                flex: 0 0 44px;
                background: #0f0f0f;
                border-left: 1px solid #242424;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding-top: 8px;
                gap: 4px;
            }

            .tool-btn {
                width: 34px;
                height: 34px;
                background: #1a1a1a;
                border: 1px solid #2e2e2e;
                border-radius: 4px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 17px;
                color: #666;
                transition: background 0.15s, border-color 0.15s, color 0.15s;
                user-select: none;
            }

            .tool-btn:hover {
                background: #222;
                border-color: #444;
                color: #ccc;
            }

            .tool-btn.active {
                background: #1c1800;
                border-color: #7a5f10;
                color: #ffd700;
            }

            /* ── Hiscores panel internals ── */

            .hs-header {
                padding: 11px 12px 10px;
                border-bottom: 1px solid #1e1e1e;
                flex-shrink: 0;
            }

            .hs-title {
                font-size: 11px;
                font-weight: bold;
                color: #ffd700;
                letter-spacing: 2px;
                text-transform: uppercase;
            }

            /* Skill tab grid */
            .hs-skills {
                display: flex;
                flex-wrap: wrap;
                gap: 3px;
                padding: 8px;
                flex-shrink: 0;
                border-bottom: 1px solid #1e1e1e;
                overflow-y: auto;
                max-height: 110px;
                scrollbar-width: thin;
                scrollbar-color: #2a2a2a #0c0c0c;
            }

            .skill-tab {
                font-size: 10px;
                padding: 3px 8px;
                background: #141414;
                border: 1px solid #272727;
                border-radius: 3px;
                color: #666;
                cursor: pointer;
                white-space: nowrap;
                transition: background 0.12s, color 0.12s, border-color 0.12s;
                user-select: none;
            }

            .skill-tab:hover {
                background: #1e1e1e;
                color: #aaa;
                border-color: #3a3a3a;
            }

            .skill-tab.active {
                background: #1c1800;
                border-color: #7a5f10;
                color: #ffd700;
            }

            /* Scrollable table area */
            .hs-table-wrap {
                flex: 1;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: #2a2a2a #0c0c0c;
            }

            .hs-message {
                padding: 24px 12px;
                text-align: center;
                color: #3a3a3a;
                font-size: 12px;
            }

            table.hs-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
            }

            table.hs-table thead th {
                position: sticky;
                top: 0;
                background: #111;
                color: #444;
                font-size: 10px;
                font-weight: normal;
                text-transform: uppercase;
                letter-spacing: 0.6px;
                padding: 7px 10px;
                text-align: left;
                border-bottom: 1px solid #1e1e1e;
            }

            table.hs-table thead th.r { text-align: right; }

            table.hs-table tbody tr {
                border-bottom: 1px solid #151515;
                transition: background 0.08s;
            }

            table.hs-table tbody tr:hover { background: #141414; }

            table.hs-table tbody td {
                padding: 7px 10px;
                color: #bbb;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 120px;
            }

            .td-rank  { color: #404040; font-size: 11px; width: 30px; }
            .td-name  { color: #d0d0d0; max-width: 130px; }
            .td-level { color: #ffd700; font-weight: bold; text-align: right; }
            .td-xp    { color: #555; font-size: 11px; text-align: right; }

            /* ── XP Tracker panel internals ── */

            .xpt-header {
                padding: 11px 12px 10px;
                border-bottom: 1px solid #1e1e1e;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .xpt-title {
                font-size: 11px;
                font-weight: bold;
                color: #ffd700;
                letter-spacing: 2px;
                text-transform: uppercase;
                white-space: nowrap;
            }

            .xpt-reset-btn {
                font-size: 10px;
                padding: 3px 8px;
                background: #1a1a1a;
                border: 1px solid #2e2e2e;
                border-radius: 3px;
                color: #666;
                cursor: pointer;
                white-space: nowrap;
                transition: background 0.12s, color 0.12s, border-color 0.12s;
                user-select: none;
            }

            .xpt-reset-btn:hover {
                background: #2a0000;
                border-color: #6a2020;
                color: #ff8080;
            }

            .xpt-scroll {
                flex: 1;
                overflow-y: auto;
                padding: 6px 0;
                scrollbar-width: thin;
                scrollbar-color: #2a2a2a #0c0c0c;
            }

            .xpt-empty {
                padding: 28px 14px;
                text-align: center;
                color: #2e2e2e;
                font-size: 12px;
            }

            .xpt-row {
                padding: 8px 12px 7px;
                border-bottom: 1px solid #111;
            }

            .xpt-row:last-child { border-bottom: none; }

            .xpt-row-top {
                display: flex;
                align-items: baseline;
                gap: 6px;
                margin-bottom: 5px;
            }

            .xpt-skill-name {
                font-size: 11px;
                font-weight: bold;
                color: #e8e8e8;
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .xpt-level {
                font-size: 10px;
                color: #aaa;
                white-space: nowrap;
            }

            .xpt-gained {
                font-size: 11px;
                color: #90ee90;
                font-weight: bold;
                white-space: nowrap;
            }

            /* Progress bar track */
            .xpt-bar-track {
                height: 5px;
                background: #1a1a1a;
                border-radius: 3px;
                overflow: hidden;
                margin-bottom: 4px;
            }

            .xpt-bar-fill {
                height: 100%;
                border-radius: 3px;
                transition: width 0.3s ease;
                opacity: 0.85;
            }

            .xpt-to-next {
                font-size: 10px;
                color: #777;
                text-align: right;
            }

            .xpt-maxed {
                font-size: 10px;
                color: #7a5f10;
                text-align: right;
                font-weight: bold;
                letter-spacing: 1px;
            }

            /* LostHQ wiki panel */
            #losthq-panel { width: 860px; }
            #losthq-panel.open { max-width: 860px; }
            #losthq-panel.maximized {
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                width: 100%; max-width: none;
                z-index: 200;
                border-left: none;
                transition: none;
            }

            .lhq-header {
                display: flex;
                align-items: center;
                padding: 11px 12px 10px;
                border-bottom: 1px solid #1e1e1e;
                flex-shrink: 0;
            }

            .lhq-title {
                font-size: 11px;
                font-weight: bold;
                color: #ffd700;
                letter-spacing: 2px;
                text-transform: uppercase;
            }

            .lhq-max-btn {
                margin-left: auto;
                cursor: pointer;
                color: #555;
                font-size: 16px;
                line-height: 1;
                user-select: none;
                padding: 2px 4px;
                border-radius: 3px;
            }

            .lhq-max-btn:hover { color: #ccc; background: #222; }

            .lhq-body {
                flex: 1 1 0;
                min-height: 0;
                position: relative;
                overflow: hidden;
                background: #111;
            }

            #losthq-frame {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                border: none;
            }

            /* World map panel */
            #worldmap-panel { width: 600px; }
            #worldmap-panel.open { max-width: 600px; }
            #worldmap-panel.maximized {
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                width: 100%; max-width: none;
                z-index: 200;
                border-left: none;
                transition: none;
            }

            .wm-header {
                display: flex;
                align-items: center;
                padding: 11px 12px 10px;
                border-bottom: 1px solid #1e1e1e;
                flex-shrink: 0;
            }

            .wm-title {
                font-size: 11px;
                font-weight: bold;
                color: #ffd700;
                letter-spacing: 2px;
                text-transform: uppercase;
            }

            .wm-max-btn {
                margin-left: auto;
                cursor: pointer;
                color: #555;
                font-size: 16px;
                line-height: 1;
                user-select: none;
                padding: 2px 4px;
                border-radius: 3px;
            }
            .wm-max-btn:hover { color: #ccc; background: #222; }

            /* Settings panel */
            #settings-panel { width: 280px; }
            #settings-panel.open { max-width: 280px; }

            .st-header {
                display: flex;
                align-items: center;
                padding: 11px 12px 10px;
                border-bottom: 1px solid #1e1e1e;
                flex-shrink: 0;
            }

            .st-title {
                font-size: 11px;
                font-weight: bold;
                color: #ffd700;
                letter-spacing: 2px;
                text-transform: uppercase;
            }

            .st-body {
                flex: 1 1 0;
                min-height: 0;
                overflow-y: auto;
                padding: 12px;
                scrollbar-width: thin;
                scrollbar-color: #2a2a2a #0c0c0c;
            }

            .st-section {
                margin-bottom: 18px;
            }

            .st-section-title {
                font-size: 10px;
                font-weight: bold;
                color: #888;
                letter-spacing: 1px;
                text-transform: uppercase;
                margin-bottom: 8px;
            }

            .st-select {
                width: 100%;
                background: #141414;
                border: 1px solid #2e2e2e;
                border-radius: 4px;
                color: #ccc;
                font-size: 11px;
                padding: 5px 7px;
                cursor: pointer;
            }

            .st-select:focus { outline: none; border-color: #555; }

            .st-field {
                margin-bottom: 10px;
            }

            .st-field:last-child {
                margin-bottom: 0;
            }

            .st-field-label {
                display: block;
                margin-bottom: 4px;
                font-size: 10px;
                color: #666;
                text-transform: uppercase;
                letter-spacing: 0.6px;
            }

            .st-action-btn {
                width: 100%;
                height: 30px;
                margin: 10px 0 0;
                padding: 0 10px;
                background: #1a1a1a;
                border: 1px solid #2e2e2e;
                border-radius: 4px;
                color: #aaa;
                cursor: pointer;
                font-size: 11px;
                text-align: left;
                transition: background 0.12s, color 0.12s, border-color 0.12s;
            }

            .st-action-btn:hover {
                background: #222;
                border-color: #444;
                color: #ccc;
            }

            .st-check-row {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 4px 0;
                font-size: 11px;
                color: #aaa;
                cursor: pointer;
            }

            .st-check-row input[type="checkbox"] {
                accent-color: #ffd700;
                width: 13px;
                height: 13px;
                cursor: pointer;
                flex-shrink: 0;
            }

            .st-check-row:hover { color: #ccc; }

            .wm-body {
                flex: 1 1 0;
                min-height: 0;
                position: relative;
                overflow: hidden;
                background: #000;
            }

            #worldmap-frame {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: none;
            }

            /* Debug console */
            #debug-console {
                display: none;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 44px;
                height: 140px;
                background: rgba(0, 0, 0, 0.92);
                color: #0f0;
                font-family: monospace;
                font-size: 11px;
                padding: 8px 10px;
                overflow-y: auto;
                z-index: 200;
                border-top: 1px solid #2a2a2a;
                scrollbar-width: thin;
                scrollbar-color: #2a2a2a transparent;
            }

            #debug-console.visible { display: block; }
            #debug-console .log-line { margin: 1px 0; line-height: 1.5; }
            #debug-console .error { color: #f55; }
            #debug-console .warn  { color: #fa0; }
        </style>
    </head>
    <body>
        <div id="layout">
            <div id="canvas-wrap">
                <canvas id="canvas" width="765" height="503"></canvas>
            </div>

            <div id="hiscores-panel" class="side-panel">
                <div class="hs-header">
                    <div class="hs-title">Hiscores</div>
                </div>
                <div class="hs-skills" id="skill-tabs"></div>
                <div class="hs-table-wrap" id="hs-content">
                    <div class="hs-message" id="hs-msg">Select a skill above</div>
                    <table class="hs-table" id="hs-table" style="display:none">
                        <thead>
                            <tr>
                                <th></th>
                                <th>Player</th>
                                <th class="r">Level</th>
                                <th class="r">XP</th>
                            </tr>
                        </thead>
                        <tbody id="hs-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="xptracker-panel" class="side-panel">
                <div class="xpt-header">
                    <div class="xpt-title">XP Tracker</div>
                    <div class="xpt-reset-btn" id="btn-xp-reset" title="Reset session XP">Reset</div>
                </div>
                <div class="xpt-scroll" id="xpt-scroll">
                    <div class="xpt-empty" id="xpt-empty">No XP gained this session</div>
                    <div id="xpt-skills"></div>
                </div>
            </div>

            <div id="worldmap-panel" class="side-panel">
                <div class="wm-header">
                    <span class="wm-title">World Map</span>
                    <span id="btn-wm-max" class="wm-max-btn" title="Maximize">&#9633;</span>
                </div>
                <div class="wm-body">
                    <iframe id="worldmap-frame" title="World Map"></iframe>
                </div>
            </div>

            <div id="settings-panel" class="side-panel">
                <div class="st-header"><span class="st-title">Settings</span></div>
                <div class="st-body">
                    <div class="st-section">
                        <div class="st-section-title">AFK Timer</div>
                        <select id="afk-select" class="st-select">
                            <option value="90000">90 seconds (default)</option>
                            <option value="120000">2 minutes</option>
                            <option value="300000">5 minutes</option>
                            <option value="600000">10 minutes</option>
                            <option value="1800000">30 minutes</option>
                            <option value="0">Never</option>
                        </select>
                    </div>
                    <div class="st-section">
                        <div class="st-section-title">Shift-Click Actions</div>
                        <label class="st-check-row"><input type="checkbox" id="sc-drop" checked> Drop (inventory items)</label>
                        <label class="st-check-row"><input type="checkbox" id="sc-take" checked> Take (ground items)</label>
                        <label class="st-check-row"><input type="checkbox" id="sc-attack"> Attack (NPCs)</label>
                        <label class="st-check-row"><input type="checkbox" id="sc-pickpocket" checked> Pickpocket (NPCs)</label>
                        <label class="st-check-row"><input type="checkbox" id="sc-bank" checked> Bank (bank NPCs)</label>
                        <label class="st-check-row"><input type="checkbox" id="sc-usequickly" checked> Use-quickly (bank booths)</label>
                        <label class="st-check-row"><input type="checkbox" id="sc-examine"> Examine (anything)</label>
                    </div>
                    <div class="st-section">
                        <div class="st-section-title">Discord</div>
                        <label class="st-check-row"><input type="checkbox" id="discord-rpc"> Discord Rich Presence</label>
                    </div>
                    <div class="st-section">
                        <div class="st-section-title">Client Settings</div>
                        <div class="st-field">
                            <label class="st-field-label" for="canvas-filter-select">Scaling</label>
                            <select id="canvas-filter-select" class="st-select">
                                <option value="auto">Auto Scaling</option>
                                <option value="pixelated">Pixel Scaling</option>
                            </select>
                        </div>
                        <div class="st-field">
                            <label class="st-field-label" for="canvas-size-select">Scale</label>
                            <select id="canvas-size-select" class="st-select">
                                <option value="1">1x</option>
                                <option value="1.5">1.5x</option>
                                <option value="2">2x</option>
                            </select>
                        </div>
                        <label class="st-check-row"><input type="checkbox" id="low-memory-mode"> Low Memory Mode</label>
                        <label class="st-check-row"><input type="checkbox" id="hd-mode"> HD Mode</label>
                        <button type="button" id="fullscreen-bars" class="st-action-btn">Fullscreen (Bars)</button>
                        <button type="button" id="fullscreen-half" class="st-action-btn">Fullscreen (Half-Fill)</button>
                        <button type="button" id="fullscreen-fill" class="st-action-btn">Fullscreen (Fill)</button>
                    </div>
                </div>
            </div>

            <div id="losthq-panel" class="side-panel">
                <div class="lhq-header">
                    <span class="lhq-title">LostHQ Wiki</span>
                    <span id="btn-lhq-max" class="lhq-max-btn" title="Maximize">&#9633;</span>
                </div>
                <div class="lhq-body">
                    <iframe id="losthq-frame" title="LostHQ Wiki"></iframe>
                </div>
            </div>

            <div id="toolbar">
                <div class="tool-btn" id="btn-hiscores" title="Hiscores">&#9813;</div>
                <div class="tool-btn" id="btn-xpdrops" title="XP Drops">XP</div>
                <div class="tool-btn" id="btn-xptracker" title="XP Tracker">&#128200;</div>
                <div class="tool-btn" id="btn-worldmap" title="World Map">&#128506;</div>
                <div class="tool-btn" id="btn-settings" title="Settings">&#9881;</div>
                <div class="tool-btn" id="btn-losthq" title="LostHQ Wiki">&#128212;</div>
            </div>
        </div>

        <div id="debug-console"></div>

        <script>
            // Debug console
            (function () {
                var el = document.getElementById('debug-console');
                var _log = console.log, _err = console.error, _warn = console.warn;
                function addLine(cls, args) {
                    var d = document.createElement('div');
                    d.className = 'log-line' + (cls ? ' ' + cls : '');
                    d.textContent = new Date().toLocaleTimeString() + '  ' + Array.from(args).join(' ');
                    el.appendChild(d);
                    el.scrollTop = el.scrollHeight;
                }
                console.log   = function () { addLine('',      arguments); _log.apply(console,  arguments); };
                console.error = function () { addLine('error', arguments); _err.apply(console,  arguments); };
                console.warn  = function () { addLine('warn',  arguments); _warn.apply(console, arguments); };
                document.addEventListener('keydown', function (e) {
                    if (e.key === '`') el.classList.toggle('visible');
                });
            })();
        </script>

        <script>
            // Hiscores
            (function () {
                // IDs are hiscore.type = PlayerStat enum index + 1 (server uses stat + 1)
                var SKILLS = [
                    { id: 'overall', label: 'Overall' },
                    { id: 1,  label: 'Attack' },
                    { id: 2,  label: 'Defence' },
                    { id: 3,  label: 'Strength' },
                    { id: 4,  label: 'Hitpoints' },
                    { id: 5,  label: 'Ranged' },
                    { id: 6,  label: 'Prayer' },
                    { id: 7,  label: 'Magic' },
                    { id: 8,  label: 'Cooking' },
                    { id: 9,  label: 'Woodcutting' },
                    { id: 10, label: 'Fletching' },
                    { id: 11, label: 'Fishing' },
                    { id: 12, label: 'Firemaking' },
                    { id: 13, label: 'Crafting' },
                    { id: 14, label: 'Smithing' },
                    { id: 15, label: 'Mining' },
                    { id: 16, label: 'Herblore' },
                    { id: 17, label: 'Agility' },
                    { id: 18, label: 'Thieving' },
                    { id: 21, label: 'Runecrafting' },
                ];

                var panelEl   = document.getElementById('hiscores-panel');
                var btnEl     = document.getElementById('btn-hiscores');
                var tabsEl    = document.getElementById('skill-tabs');
                var msgEl     = document.getElementById('hs-msg');
                var tableEl   = document.getElementById('hs-table');
                var bodyEl    = document.getElementById('hs-body');
                var isOpen    = false;
                var activeId  = 'overall';

                function fmt(n) { return Number(n).toLocaleString(); }

                function setLoading(msg) {
                    msgEl.textContent = msg;
                    msgEl.style.display = 'block';
                    tableEl.style.display = 'none';
                }

                function renderRows(data) {
                    if (!data || !data.length) {
                        setLoading('No data available.');
                        return;
                    }
                    bodyEl.innerHTML = data.map(function (e) {
                        return '<tr>' +
                            '<td class="td-rank">' + e.rank + '</td>' +
                            '<td class="td-name">' + e.username + '</td>' +
                            '<td class="td-level">' + fmt(e.level) + '</td>' +
                            '<td class="td-xp">'   + fmt(e.xp)   + '</td>' +
                        '</tr>';
                    }).join('');
                    msgEl.style.display = 'none';
                    tableEl.style.display = 'table';
                }

                function loadSkill(skillId) {
                    setLoading('Loading\u2026');
                    fetch('/api/hiscores?skill=' + skillId)
                        .then(function (r) { return r.json(); })
                        .then(renderRows)
                        .catch(function (e) {
                            setLoading('Failed to load.');
                            console.error('[hiscores]', e);
                        });
                }

                // Build skill tabs
                SKILLS.forEach(function (skill) {
                    var tab = document.createElement('div');
                    tab.className = 'skill-tab' + (skill.id === activeId ? ' active' : '');
                    tab.textContent = skill.label;
                    tab.addEventListener('click', function () {
                        document.querySelectorAll('.skill-tab').forEach(function (t) {
                            t.classList.remove('active');
                        });
                        tab.classList.add('active');
                        activeId = skill.id;
                        loadSkill(skill.id);
                    });
                    tabsEl.appendChild(tab);
                });

                btnEl.addEventListener('click', function () {
                    isOpen = !isOpen;
                    btnEl.classList.toggle('active', isOpen);
                    panelEl.classList.toggle('open', isOpen);
                    if (isOpen) loadSkill(activeId);
                });
            })();

            // XP Drops toggle
            (function () {
                var btn = document.getElementById('btn-xpdrops');
                window.XP_DROPS_ENABLED = true;
                btn.classList.add('active');
                btn.addEventListener('click', function () {
                    window.XP_DROPS_ENABLED = !window.XP_DROPS_ENABLED;
                    btn.classList.toggle('active', window.XP_DROPS_ENABLED);
                });
            })();

            // XP Tracker panel
            (function () {
                var panelEl  = document.getElementById('xptracker-panel');
                var btnEl    = document.getElementById('btn-xptracker');
                var resetBtn = document.getElementById('btn-xp-reset');
                var emptyEl  = document.getElementById('xpt-empty');
                var skillsEl = document.getElementById('xpt-skills');
                var isOpen   = false;

                function fmt(n) { return Number(n).toLocaleString(); }

                function renderTracker() {
                    var data = window.xpTrackerData;
                    if (!data || !data.entries || !data.entries.length) {
                        emptyEl.style.display = 'block';
                        skillsEl.innerHTML = '';
                        return;
                    }
                    emptyEl.style.display = 'none';
                    skillsEl.innerHTML = data.entries.map(function (e) {
                        var gained   = e.gained   | 0;
                        var xpToNext = e.xpToNext | 0;
                        var pct = Math.max(0, Math.min(100, e.progressPct || 0)).toFixed(2);
                        var subline = e.level >= 99
                            ? '<div class="xpt-maxed">MAX LEVEL</div>'
                            : '<div class="xpt-to-next">' + fmt(xpToNext) + ' xp to level ' + (e.level + 1) + '</div>';
                        return '<div class="xpt-row">' +
                            '<div class="xpt-row-top">' +
                                '<span class="xpt-skill-name">' + e.name + '</span>' +
                                '<span class="xpt-level">Lv&nbsp;' + e.level + '</span>' +
                                '<span class="xpt-gained">+' + fmt(gained) + '</span>' +
                            '</div>' +
                            '<div class="xpt-bar-track">' +
                                '<div class="xpt-bar-fill" style="width:' + pct + '%;background:' + e.colour + '"></div>' +
                            '</div>' +
                            subline +
                        '</div>';
                    }).join('');
                }

                window.addEventListener('xpupdate', renderTracker);

                resetBtn.addEventListener('click', function () {
                    if (typeof window.resetXpTracker === 'function') {
                        window.resetXpTracker();
                    }
                });

                btnEl.addEventListener('click', function () {
                    isOpen = !isOpen;
                    btnEl.classList.toggle('active', isOpen);
                    panelEl.classList.toggle('open', isOpen);
                    if (isOpen) renderTracker();
                });
            })();

            // Settings panel
            (function () {
                var btn    = document.getElementById('btn-settings');
                var panel  = document.getElementById('settings-panel');
                var afkSel = document.getElementById('afk-select');
                var filterSel = document.getElementById('canvas-filter-select');
                var sizeSel = document.getElementById('canvas-size-select');
                var lowMemoryChk = document.getElementById('low-memory-mode');
                var hdModeChk = document.getElementById('hd-mode');
                var fullscreenBarsBtn = document.getElementById('fullscreen-bars');
                var fullscreenHalfBtn = document.getElementById('fullscreen-half');
                var fullscreenFillBtn = document.getElementById('fullscreen-fill');
                var canvas = document.getElementById('canvas');
                var isOpen = false;

                var SC_IDS = ['drop', 'take', 'attack', 'pickpocket', 'bank', 'usequickly', 'examine'];

                var discordChk = document.getElementById('discord-rpc');

                function loadPrefs() {
                    var saved = localStorage.getItem('afkTimerMs');
                    var ms = saved !== null ? parseInt(saved, 10) : 90000;
                    window.afkTimerMs = ms;
                    afkSel.value = String(ms);

                    var scSaved = localStorage.getItem('shiftClickPrefs');
                    var defaultPrefs = { drop: true, take: true, pickpocket: true, bank: true, usequickly: true };
                    var prefs = Object.assign({}, defaultPrefs, scSaved ? JSON.parse(scSaved) : {});
                    SC_IDS.forEach(function (id) {
                        var el = document.getElementById('sc-' + id);
                        if (el) el.checked = !!prefs[id];
                    });
                    applyShiftPrefs(prefs);

                    var discordEnabled = localStorage.getItem('discordRpcEnabled') === 'true';
                    window.DISCORD_RPC_ENABLED = discordEnabled;
                    if (discordChk) discordChk.checked = discordEnabled;

                    var savedCanvasSize = localStorage.getItem('canvasSize');
                    if (localStorage.getItem('canvasSizeDefaultVersion') !== '2') {
                        if (savedCanvasSize === null || savedCanvasSize === '1.5') {
                            savedCanvasSize = '2';
                        }
                        localStorage.setItem('canvasSizeDefaultVersion', '2');
                    }
                    applyCanvasSize(savedCanvasSize === '1' || savedCanvasSize === '1.5' ? savedCanvasSize : '2');
                    applyCanvasFilter(localStorage.getItem('filtering') === 'false' ? 'auto' : (localStorage.getItem('canvasFilter') || 'pixelated'));
                    applyLowMemoryMode(localStorage.getItem('clientLowMemoryMode') === 'true');
                    applyHdMode(localStorage.getItem('clientHdMode') === 'true');
                }

                function applyShiftPrefs(prefs) {
                    window.shiftClickPrefs = prefs;
                }

                function saveShiftPrefs() {
                    var prefs = {};
                    SC_IDS.forEach(function (id) {
                        var el = document.getElementById('sc-' + id);
                        prefs[id] = el ? el.checked : false;
                    });
                    localStorage.setItem('shiftClickPrefs', JSON.stringify(prefs));
                    applyShiftPrefs(prefs);
                }

                function applyCanvasSize(size) {
                    if (!canvas) return;
                    if (size !== '1' && size !== '1.5' && size !== '2') {
                        size = '2';
                    }
                    var scale = parseFloat(size);

                    canvas.style.width = (765 * scale) + 'px';
                    canvas.style.height = (503 * scale) + 'px';
                    canvas.style.maxWidth = 'none';
                    canvas.style.maxHeight = 'none';
                    if (sizeSel) sizeSel.value = size;
                    localStorage.setItem('canvasSize', size);
                }

                function applyCanvasFilter(filter) {
                    if (filter !== 'auto' && filter !== 'pixelated') {
                        filter = 'pixelated';
                    }
                    if (canvas) canvas.style.imageRendering = filter;
                    if (filterSel) filterSel.value = filter;
                    localStorage.setItem('canvasFilter', filter);
                    localStorage.setItem('filtering', filter === 'pixelated' ? 'true' : 'false');
                }

                function applyLowMemoryMode(enabled) {
                    if (enabled && hdModeChk) {
                        hdModeChk.checked = false;
                        window.CLIENT_HD_MODE = false;
                        localStorage.setItem('clientHdMode', 'false');
                        if (typeof window.setClientHdMode === 'function') {
                            window.setClientHdMode(false);
                        }
                    }

                    window.CLIENT_LOW_MEMORY = !!enabled;
                    if (lowMemoryChk) lowMemoryChk.checked = !!enabled;
                    localStorage.setItem('clientLowMemoryMode', enabled ? 'true' : 'false');

                    if (typeof window.setClientLowMemoryMode === 'function') {
                        window.setClientLowMemoryMode(!!enabled);
                    }
                }

                function applyHdMode(enabled) {
                    window.CLIENT_HD_MODE = !!enabled;
                    if (hdModeChk) hdModeChk.checked = !!enabled;
                    localStorage.setItem('clientHdMode', enabled ? 'true' : 'false');
                    if (canvas) canvas.classList.toggle('hd-mode-active', !!enabled);

                    if (enabled) {
                        applyLowMemoryMode(false);
                        applyCanvasFilter('auto');
                        applyCanvasSize('2');
                    }

                    if (typeof window.setClientHdMode === 'function') {
                        window.setClientHdMode(!!enabled);
                    }
                }

                function fullscreenElement() {
                    return document.fullscreenElement ||
                        document.webkitFullscreenElement ||
                        document.mozFullScreenElement ||
                        document.msFullscreenElement;
                }

                async function callWailsWindow(method) {
                    var response = await fetch('/wails/runtime', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-wails-client-id': (window._wails && window._wails.clientId) || 'client-settings'
                        },
                        body: JSON.stringify({
                            object: 6,
                            method: method
                        })
                    });

                    if (!response.ok) {
                        throw new Error(await response.text());
                    }

                    var contentType = response.headers.get('Content-Type') || '';
                    return contentType.indexOf('application/json') !== -1 ? response.json() : response.text();
                }

                async function fullscreenActive() {
                    var nativeFullscreen = false;
                    try {
                        nativeFullscreen = await callWailsWindow(13);
                    } catch (_e) {
                        nativeFullscreen = false;
                    }

                    return nativeFullscreen || fullscreenElement();
                }

                async function updateFullscreenButtons() {
                    if (!fullscreenBarsBtn && !fullscreenHalfBtn && !fullscreenFillBtn) return;

                    var layout = document.getElementById('layout');
                    var active = await fullscreenActive();
                    var halfActive = !!(active && layout && layout.classList.contains('app-fullscreen-half'));
                    var fillActive = !!(active && layout && layout.classList.contains('app-fullscreen-fill'));

                    if (!active && layout) {
                        layout.classList.remove('app-fullscreen-half', 'app-fullscreen-fill');
                    }
                    if (fullscreenBarsBtn) {
                        fullscreenBarsBtn.textContent = active && !halfActive && !fillActive ? 'Exit Fullscreen (Bars)' : 'Fullscreen (Bars)';
                    }
                    if (fullscreenHalfBtn) {
                        fullscreenHalfBtn.textContent = halfActive ? 'Exit Fullscreen (Half-Fill)' : 'Fullscreen (Half-Fill)';
                    }
                    if (fullscreenFillBtn) {
                        fullscreenFillBtn.textContent = fillActive ? 'Exit Fullscreen (Fill)' : 'Fullscreen (Fill)';
                    }
                }

                async function exitLayoutFullscreen() {
                    var layout = document.getElementById('layout');
                    if (layout) layout.classList.remove('app-fullscreen-half', 'app-fullscreen-fill');

                    try {
                        if (await fullscreenActive()) {
                            await callWailsWindow(38);
                        }
                        updateFullscreenButtons();
                        return;
                    } catch (_e) {
                        // Browser previews do not expose the native Wails window runtime.
                    }

                    if (fullscreenElement()) {
                        if (document.exitFullscreen) {
                            await document.exitFullscreen();
                        } else if (document.webkitExitFullscreen) {
                            document.webkitExitFullscreen();
                        } else if (document.mozCancelFullScreen) {
                            document.mozCancelFullScreen();
                        } else if (document.msExitFullscreen) {
                            document.msExitFullscreen();
                        }
                    }
                    updateFullscreenButtons();
                }

                async function toggleLayoutFullscreen(mode) {
                    var layout = document.getElementById('layout');
                    var halfMode = mode === 'half';
                    var fillMode = mode === 'fill';
                    var active = await fullscreenActive();

                    if (active) {
                        var activeMode = 'bars';
                        if (layout && layout.classList.contains('app-fullscreen-half')) {
                            activeMode = 'half';
                        } else if (layout && layout.classList.contains('app-fullscreen-fill')) {
                            activeMode = 'fill';
                        }
                        if (activeMode === mode) {
                            await exitLayoutFullscreen();
                            return;
                        }
                        if (layout) {
                            layout.classList.toggle('app-fullscreen-half', halfMode);
                            layout.classList.toggle('app-fullscreen-fill', fillMode);
                        }
                        updateFullscreenButtons();
                        return;
                    }

                    if (layout) {
                        layout.classList.toggle('app-fullscreen-half', halfMode);
                        layout.classList.toggle('app-fullscreen-fill', fillMode);
                    }

                    try {
                        await callWailsWindow(38);
                        updateFullscreenButtons();
                        return;
                    } catch (_e) {
                        // Browser previews do not expose the native Wails window runtime.
                    }

                    if (!layout) {
                        updateFullscreenButtons();
                        return;
                    }

                    if (layout.requestFullscreen) {
                        await layout.requestFullscreen();
                    } else if (layout.webkitRequestFullscreen) {
                        layout.webkitRequestFullscreen();
                    } else if (layout.mozRequestFullScreen) {
                        layout.mozRequestFullScreen();
                    } else if (layout.msRequestFullscreen) {
                        layout.msRequestFullscreen();
                    }
                    updateFullscreenButtons();
                }

                afkSel.addEventListener('change', function () {
                    var ms = parseInt(afkSel.value, 10);
                    window.afkTimerMs = ms;
                    localStorage.setItem('afkTimerMs', String(ms));
                });

                SC_IDS.forEach(function (id) {
                    var el = document.getElementById('sc-' + id);
                    if (el) el.addEventListener('change', saveShiftPrefs);
                });

                if (discordChk) {
                    discordChk.addEventListener('change', function () {
                        window.DISCORD_RPC_ENABLED = discordChk.checked;
                        localStorage.setItem('discordRpcEnabled', discordChk.checked ? 'true' : 'false');
                        if (discordChk.checked) {
                            // Connect immediately if already in-game.
                            fetch('/api/discord/connect').catch(function () {});
                        } else {
                            fetch('/api/discord/disconnect').catch(function () {});
                        }
                    });
                }

                if (filterSel) {
                    filterSel.addEventListener('change', function () {
                        applyCanvasFilter(filterSel.value);
                    });
                }

                if (sizeSel) {
                    sizeSel.addEventListener('change', function () {
                        applyCanvasSize(sizeSel.value);
                    });
                }

                if (lowMemoryChk) {
                    lowMemoryChk.addEventListener('change', function () {
                        applyLowMemoryMode(lowMemoryChk.checked);
                    });
                }

                if (hdModeChk) {
                    hdModeChk.addEventListener('change', function () {
                        applyHdMode(hdModeChk.checked);
                    });
                }

                if (fullscreenBarsBtn) {
                    fullscreenBarsBtn.addEventListener('click', function () {
                        toggleLayoutFullscreen('bars');
                    });
                }

                if (fullscreenHalfBtn) {
                    fullscreenHalfBtn.addEventListener('click', function () {
                        toggleLayoutFullscreen('half');
                    });
                }

                if (fullscreenFillBtn) {
                    fullscreenFillBtn.addEventListener('click', function () {
                        toggleLayoutFullscreen('fill');
                    });
                }

                if (fullscreenBarsBtn || fullscreenHalfBtn || fullscreenFillBtn) {
                    document.addEventListener('fullscreenchange', updateFullscreenButtons);
                    document.addEventListener('webkitfullscreenchange', updateFullscreenButtons);
                    document.addEventListener('mozfullscreenchange', updateFullscreenButtons);
                    document.addEventListener('MSFullscreenChange', updateFullscreenButtons);
                }

                btn.addEventListener('click', function () {
                    isOpen = !isOpen;
                    btn.classList.toggle('active', isOpen);
                    panel.classList.toggle('open', isOpen);
                });

                loadPrefs();
            })();

            // LostHQ Wiki panel
            (function () {
                var btn    = document.getElementById('btn-losthq');
                var panel  = document.getElementById('losthq-panel');
                var frame  = document.getElementById('losthq-frame');
                var maxBtn = document.getElementById('btn-lhq-max');
                var isOpen = false;
                var loaded = false;
                var isMaximized = false;

                maxBtn.addEventListener('click', function () {
                    isMaximized = !isMaximized;
                    panel.classList.toggle('maximized', isMaximized);
                    maxBtn.textContent = isMaximized ? '⊟' : '□';
                    maxBtn.title = isMaximized ? 'Restore' : 'Maximize';
                });

                btn.addEventListener('click', function () {
                    isOpen = !isOpen;
                    btn.classList.toggle('active', isOpen);
                    panel.classList.toggle('open', isOpen);
                    if (!isOpen && isMaximized) {
                        isMaximized = false;
                        panel.classList.remove('maximized');
                        maxBtn.textContent = '□';
                        maxBtn.title = 'Maximize';
                    }
                    if (isOpen && !loaded) {
                        loaded = true;
                        frame.src = '/losthq/index.html';
                    }
                });
            })();

            // World Map panel
            (function () {
                var btn    = document.getElementById('btn-worldmap');
                var panel  = document.getElementById('worldmap-panel');
                var frame  = document.getElementById('worldmap-frame');
                var maxBtn = document.getElementById('btn-wm-max');
                var isOpen = false;
                var loaded = false;
                var isMaximized = false;

                function sendPlayerPos() {
                    var pos = window.playerMapPos;
                    if (frame && frame.contentWindow && pos) {
                        frame.contentWindow.postMessage({ type: 'playerPos', tileX: pos.tileX, tileZ: pos.tileZ }, '*');
                    }
                }

                window.addEventListener('playermove', function () {
                    if (isOpen) sendPlayerPos();
                });

                window.addEventListener('message', function (e) {
                    if (e.data && e.data.type === 'mapviewReady' && isOpen) sendPlayerPos();
                });

                maxBtn.addEventListener('click', function () {
                    isMaximized = !isMaximized;
                    panel.classList.toggle('maximized', isMaximized);
                    maxBtn.textContent = isMaximized ? '⊟' : '□';
                    maxBtn.title = isMaximized ? 'Restore' : 'Maximize';
                });

                btn.addEventListener('click', function () {
                    isOpen = !isOpen;
                    btn.classList.toggle('active', isOpen);
                    panel.classList.toggle('open', isOpen);
                    if (!isOpen && isMaximized) {
                        isMaximized = false;
                        panel.classList.remove('maximized');
                        maxBtn.textContent = '□';
                        maxBtn.title = 'Maximize';
                    }
                    if (isOpen) {
                        if (!loaded) {
                            loaded = true;
                            frame.src = 'mapview.html?nolabels';
                        }
                        sendPlayerPos();
                    }
                });
            })();
        </script>

        <!-- Shift-click debug watcher: logs window._ml and window._sd to the backtick console whenever they change -->
        <script>
            (function () {
                var lastMl, lastSd;
                setInterval(function () {
                    var ml = window._ml, sd = window._sd;
                    if (ml !== lastMl) { lastMl = ml; console.log('[_ml]', JSON.stringify(ml)); }
                    if (sd !== lastSd) { lastSd = sd; console.log('[_sd]', JSON.stringify(sd)); }
                }, 200);
            })();
        </script>

        <!-- Runtime config served dynamically by Go (reflects actual port settings) -->
        <script src="/client-config.js"></script>
        <script>
            (function () {
                var s = document.createElement('script');
                s.type = 'module';
                s.src = 'client.js';
                document.head.appendChild(s);
            })();
        </script>
    </body>
</html>
